
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15RS - Səsvermə</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            color: #ccc;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .info {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .info h2 {
            margin-bottom: 8px;
            font-size: 20px;
        }

        .participant {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .participant-name {
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .vote-btn {
            background: #111;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 15px;
            flex-shrink: 0;
        }

        .vote-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            background: white;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 13px;
            padding: 30px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>15RS</h1>
        <p>Səsvermə</p>
    </div>

    <main class="container">
        <div class="info">
            <h2>Bugünkü səsvermə</h2>
            <p>Səsvermə hər gün saat 21:00-da yenilənir.</p>
        </div>

        <div id="participants-list" aria-live="polite">
            <p class="message">İştirakçılar yüklənir...</p>
        </div>

        <div class="footer">15RS © 2026</div>
    </main>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://xysfbigwhpnbhzudsdih.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_azLsIC6uEL2O6UGt6qmwzA_uhUPTp12";

        const list = document.getElementById("participants-list");

        async function loadParticipants() {
            list.replaceChildren();

            const loading = document.createElement("p");
            loading.className = "message";
            loading.textContent = "İştirakçılar yüklənir...";
            list.appendChild(loading);

            try {
                if (!window.supabase) {
                    throw new Error(
                        "Supabase kitabxanası yüklənmədi. İnternet bağlantısını yoxlayın."
                    );
                }

                const supabaseClient = window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

                console.log("Supabase sorğusu başladı");

                const { data, error } = await supabaseClient
                    .from("participants")
                    .select("id, name")
                    .order("id", { ascending: true });

                if (error) {
                    console.error("Supabase xətası:", error);
                    throw new Error(error.message);
                }

                console.log("Supabase cavabı:", data);

                list.replaceChildren();

                if (!data || data.length === 0) {
                    const emptyMessage = document.createElement("p");
                    emptyMessage.className = "message";
                    emptyMessage.textContent =
                        "Hələ iştirakçı əlavə edilməyib.";
                    list.appendChild(emptyMessage);
                    return;
                }

                data.forEach(function(participant) {
                    const item = document.createElement("div");
                    item.className = "participant";

                    const name = document.createElement("span");
                    name.className = "participant-name";
                    name.textContent = participant.name;

                    const button = document.createElement("button");
                    button.className = "vote-btn";
                    button.textContent = "Səs ver";
                    button.disabled = true;
                    button.title =
                        "Səsvermə növbəti mərhələdə aktivləşdiriləcək";

                    item.append(name, button);
                    list.appendChild(item);
                });

            } catch (err) {
                console.error("İştirakçıları yükləmək mümkün olmadı:", err);

                list.replaceChildren();

                const errorMessage = document.createElement("p");
                errorMessage.className = "message";
                errorMessage.textContent =
                    "İştirakçılar yüklənmədi. Xəta: " + err.message;

                list.appendChild(errorMessage);
            }
        }

        loadParticipants();
    </script>
</body>
</html>
